# hik-person 参数文件
#
# 优先级：命令行 > 本文件 > 代码里的兜底默认值。
# 未知键名会被警告（不会静默忽略），类型不对也会警告并忽略该项。
# 命令行想临时覆盖就见 `uv run hik-person --help`。

[camera]
# 本机 MV-CS016-10UC（DA2360141）；用 `uv run hik-person --list` 看所有可选相机。
# 留空则按下面的 index 在"物理相机"里数（虚拟相机不占号）。
# 另一台 MV-CB016-10UC-S（DB1505178）用 --serial 指即可；`feature` 的符号名会自动
# 换成该机型认的那个，不用改这个文件。
serial = "DA2360141"
index = 0

# 采集帧率上限（0 = 保持设备设置）。MV-CB016-10UC-S 实测上限取决于 ADCBitDepth：
# Bits_8 -> 249.1 fps，Bits_12 -> 165.4 fps，见下面的 feature。
camera_fps = 60.0

# 曝光/增益：
#   "sdk"    = 用相机自己的自动曝光 + 自动增益（默认，推荐）
#   "manual" = 固定用下面的 exposure_us / gain_db
exposure_mode = "sdk"

# AE 目标灰度（写进相机的 Brightness 特性，0-255）。仅 "sdk" 模式用。
brightness = 110.0

# AE 允许的最大增益（dB）。增益比曝光噪得多，所以先把曝光上限放开，再压住增益。
# -1 = 不动它（用相机当前值）。
auto_gain_max_db = 16.98

# AE 的起点：开自动前先把曝光钉到这个值（us），0 = 不重置（用相机现存值）。
# 相机把上次的曝光/增益存在自己身上，换相机、或别人用 MVS 客户端动过之后起跑线
# 就不一样（实测刚开 Continuous 时读到的几百 us 只是半路值），钉一下每轮起点一致。
exposure_start_us = 8000.0

# AE 的曝光上限 = exposure_fps_headroom / camera_fps（秒）：既能调亮又不拖累帧率。
# 踩过的坑：这台相机 AutoExposureTimeUpperLimit 出厂只有 3828 us，AE 被卡在这个
# 天花板里，于是只能把增益拉到 16.98 dB（设备上限 = 满噪点）而画面仍然很暗。
# 这个特性是 Int（不是 Float），用 SetFloatValue 写会得到 0x80000109，看着像“不支持”。
exposure_fps_headroom = 0.9

# "manual" 模式的曝光/增益。exposure_us：0 = 用设备当前值；
# gain_db：-1 = 用设备当前值（0 dB 是该机型合法的最小增益，不能当哨兵值）。
exposure_us = 8000.0
gain_db = -1.0

# 取一帧的等待上限（毫秒）。低于相机帧间隔会开始丢帧。
read_timeout_ms = 1000

# 任意 GenICam 特性，格式 "NAME=VALUE"。
# ADCBitDepth 让这台相机从 165.4 fps 解锁到 249.1 fps（两台机型都实测过，需配合
# camera_fps 一起放开）。
#
# 符号名随机型不同（数值都是 0 = 8bit / 3 = 12bit）：
#   MV-CB016-10UC-S（DB1505178）: Bits_8         / Bits_12          <- 本机
#   MV-CS016-10UC  （DA2360141）: ADCBitDepth_8  / ADCBitDepth_12
# 写错机型的名字不会报错也能跑：能确定是同一个设置就自动改写，并在日志里说清楚
# （见 README）。名字里的数字对不上或多解时才会报 0x80000004。
# 不想动就设成空数组 []。
feature = ["ADCBitDepth=Bits_8"]

[detector]
# 姿态权重（ultralytics pose 任务）：给检测框 + 17 个 COCO 关键点，唯一一条任务线。
# 相对路径按项目根解析。n/s/m/l/x 同一 API；这里选 m：n 档实测 7.4 ms/帧，
# m 档 16.6 ms/帧（RTX 4060 Laptop，imgsz 640），15 Hz 的 66 ms 预算下更准。
weights = "models/yolo26m-pose.pt"
conf = 0.35
imgsz = 640
# "" = 有 CUDA 用 cuda:0，否则 cpu。
device = ""
# 仅 pose：关键点置信度低于它就当没看见（画骨架与 rerun 都受影响）。
kpt_conf = 0.5

[run]
# 推理与可视化频率（相机更快时多余帧只取流不推理）。
detect_hz = 15.0
# 限速容忍：帧到达时刻正好压在周期边界上时靠它避免白丢一半的帧（实测 15/15、30/15 都会）。
rate_tolerance = 0.9
# 跑够 duration 秒或 max_frames 帧后退出；0 = 不限。
duration = 0.0
max_frames = 0
# 检测到人时存标注图（模型画的框/骨架）。
save_dir = ""
save_min_interval = 1.0

[rerun]
enabled = true
# 默认纯显示：不写任何文件。非空才写 .rrd 且不弹窗口（调试/无桌面时才用）。
save = ""

# false（默认）= 图像/框/关键点用 static 记录：viewer 只保留最新一份，没有时间轴可回拖，
# 内存不随帧数涨。true = 带时间戳、可回拖，但内存一直涨（每帧约 0.13 MB 压缩图）。
keep_history = false

# 兼底硬上限（到顶丢最旧数据）；rerun 自己的默认是 75%（本机约 23 GB）。
memory_limit = "512MB"
server_memory_limit = "512MB"
# 图像送进 viewer 前先压成 JPEG（质量 1-100，0 = 不压原图）。
# 原图 1440×1080 每帧 4.67 MB，viewer 内存增长实测 +70 MB/s；
# 75 时每帧约 0.13 MB，增长 +4 MB/s（约 1/12）。
jpeg_quality = 75
# viewer 的端口；被占用时 rerun 会直接拿来用。
port = 9876
# 摔倒报警灯的闪烁频率（Hz）：红灯明暗交替；0 = 常亮不闪。
fall_light_flash = 2.0

# 右列放什么。数值行 = 每人一行短文本（距/速/状态/有效关节），速度 = 每人一条曲线
# （与数值行的「速」同源）。人数曲线默认不上（数据一直在，只是不占格子），
# 要看就 show_count = true。轨迹不再画到画面上（tracker 仍记录，见 [track].trail_*）。
show_values = true
show_metrics = true
show_count = false

[pose3d]
# 单目 3D 骨架：yolo26*-depth 给 pose 的 17 个关键点补一个 z，在 rerun 右下角
# 的 Spatial3DView 小窗里画出来。只在 rerun 开着时生效。
# 深度是模型从单张图估的，绝对尺度会有出入；看骨架结构够用，别当测距。
enabled = true

# depth 权重（ultralytics 的 depth 任务模型）。相对路径按项目根解析。
# n/s/m/l/x 都在同一个 API 下；这里选 m：精度比 s 明显好，跟 m-pose 合计仍在 15 Hz 的
# 66 ms 预算内（各档延迟见 README 的深度模型选型表）。换模型只改这一行。
weights = "models/yolo26m-depth.pt"
# 深度推理的输入边长。权重是在 768 训练/评测的，320 远没喂饱：实测跟 m@768 的
# 一致度从 0.75（320）跳到 0.96（640），收益比换大模型还大。深度模型不便宜，
# 没必要跟满 detect_hz（见 hz）。
imgsz = 640
# 3D 骨架的更新频率（Hz）。深度模型不便宜，没必要跟满 detect_hz。
# 0 = 每个推理帧都算。
hz = 15.0
# 假定的水平视场角（度）。相机没标定，只能按普通镜头估；
# 用来把“像素 + 深度”还原成 3D 坐标，不准确主要影响骨架的胖瘦/远近感。
fov_deg = 60.0

# 左列下面再放一块估计深度图（Turbo 伪彩，悬停看米数）。
depth_view = true

# 固定 3D 视角（相机坐标系，米）：eye=眼位，look_at=看向的点，eye_up=上方向。
# 不固定的话 rerun 会按数据包围盒自动取景，而深度逐帧抖动，画面会一直“自动缩放”。
# 想换视角就改这三个数（Y 向下，所以上方向是 -Y）；viewer 里仍可鼠标拖。
eye = [0.0, 0.0, -1.5]
look_at = [0.0, 0.0, 2.5]
eye_up = [0.0, -1.0, 0.0]

# 卡尔曼滤波：每个人的每个 3D 关键点一个恒定速度滤波，平滑单目深度的抖动。
# 跨帧配对靠检测框 IoU；没外部依赖。
kalman = true
# 过程噪声（加速度，m/s²）：越大越跟手、越不平滑。
kalman_process = 10.0
# 观测噪声（m）：越大越平滑（越信模型、越不信当前观测）。
kalman_measurement = 0.1


[track]
# 跨帧关联（前后帧检测框 IoU 贪心配对）+ 轨迹。配上的沿用同一个 id，id 单调递增、
# 永不复用，所以能直接写进日志当人的编号。
# 两次检测的匹配线：越高越容易把同一个人判成两个；越低越容易把两个人并成一个。
iou_threshold = 0.3
# >0 时配对还要满足 3D 距离不超过它（米），两人交叉而过时不至于换 id；
# 0 = 只看 IoU。单目深度的绝对尺度会飘，这个门限别设得太紧。
match_max_distance = 0.0
# 连续漏检这么多帧后删轨迹。期间位置由卡尔曼预测，短时间被遮挡不会丢 id。
max_missed = 5
# 单个关键点连续丢这么多帧后不再画（人的其他部位继续画）。
max_missed_kpt = 3
# 轨迹点数上限与采样间隔（0 = 不留轨迹）。默认 300 点 / 0.1 s ≈ 30 秒。
trail_length = 300
trail_interval = 0.1
# 速度指数平滑时间常数（秒）：0 = 不平滑。单目深度抖动大，不平滑会看到速度乱跳。
speed_smoothing = 0.3
# 低于它当“静止”（只影响显示与状态标签，不动曲线原始值）。
speed_deadband = 0.15


[world]
# 相机坐标系 -> 世界（地面）系的静态外参。默认关：没量安装高度/俯仰角时，
# 绝对坐标整体是错的，不如不开（外参不准只会整体偏移，不影响骨架形状与相对距离）。
enabled = false
# 光心离地高度（米）。卷尺量，或把人放到已知距离看深度读数校准。
height = 1.0
# 镜头下俯角度（度，正 = 向下）。手机水平仪贴在相机外壳上量，或用已知身高反推。
pitch_deg = 0.0
# 相机朝向与世界 X 的夹角（度，左转为正）与绕光轴的旋转；装得周正就都是 0。
yaw_deg = 0.0
roll_deg = 0.0
# 右下角再开一个世界系 3D 视图（相机系那个照旧）。
view = false

# 尺度提醒：3D 坐标来自 yolo26*-depth 的单目估计，绝对尺度会飘。
# 世界坐标适合"谁在谁左边、大概多远"这类相对比较，别当公制真值；
# 要给底盘发坐标先拿已知身高或已知距离把尺度校一遍。

[output]
# 非空则把人写成 JSON Lines（追加写，一行一帧，直接 json.loads 就能读）。
# 每行：t/wall/frame/device_timestamp_ms/count + people[]（id/conf/distance/cam/world/
# speed/speed_ground/state/velocity/box/valid_keypoints/coverage/age/missed）。
# cam 与世界坐标同样建立在单目估计深度上，绝对公制值不可全信。
jsonl = ""
# 写 JSONL 的频率（Hz）。跟踪是高频的，日志没必要跟满。
hz = 5.0


[fall]
# 摔倒检测：三步判据（冲击 -> 躺倒 -> 持续），缺一步都不报警，见 fall.py。
# 已知边界：主动快速躺下会报警（与摔倒分不开）；被抱起来搬走可能误报。
enabled = true
# 冲击：向下速度超过它（m/s），或在窗口内从高点掉了这么多（m）。
impact_speed = 1.0
drop_height = 0.35
impact_window = 0.7
# 躺倒：躯干与"上"方向夹角超过它（度）；角度被遮时用"低于站立参考这么多"（m）兜底。
lying_angle = 60.0
lying_height = 0.35
# 时序：躺倒连续保持这么久（s）才确认；冲击后超过 confirm_window（s）就当没事。
lying_time = 1.2
confirm_window = 3.0
# 恢复到直立（度）并保持这么久（s）才解除报警。
recover_angle = 35.0
recover_time = 1.0
# 注意：这边的米制阈值都建立在单目估计深度上，是"估计尺度"的经验值，
# 调参请对着 person/metrics/fall 那两条曲线（torso_angle / fall_level）看，
# 别照搬 d435i（真深度）的值。
